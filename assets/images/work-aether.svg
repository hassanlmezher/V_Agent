<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 560" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e14"/><stop offset="1" stop-color="#15121f"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#03b5d3"/>
    </linearGradient>
    <radialGradient id="glowV" cx=".2" cy=".2" r=".6"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx=".85" cy=".8" r=".6"><stop offset="0" stop-color="#03b5d3" stop-opacity=".3"/><stop offset="1" stop-color="#03b5d3" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1024" height="560" fill="url(#bg)"/>
  <rect width="1024" height="560" fill="url(#glowV)"/>
  <rect width="1024" height="560" fill="url(#glowC)"/>

  <!-- App window -->
  <rect x="64" y="56" width="896" height="448" rx="22" fill="#17161d" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="64" y="56" width="896" height="56" rx="22" fill="#1d1c24"/>
  <rect x="64" y="90" width="896" height="22" fill="#1d1c24"/>
  <!-- Logo: medical cross -->
  <rect x="92" y="70" width="28" height="28" rx="8" fill="url(#grad)"/>
  <path d="M103 77h6v7h7v6h-7v7h-6v-7h-7v-6h7z" fill="#fff"/>
  <text x="132" y="90" fill="#e4e1e7" font-size="16" font-weight="600">Aether Health</text>
  <text x="252" y="90" fill="#958da1" font-size="13">· Triage Agent</text>
  <circle cx="826" cy="84" r="5" fill="#4cd7f6"/>
  <circle cx="826" cy="84" r="10" fill="#4cd7f6" opacity=".25"/>
  <text x="840" y="89" fill="#4cd7f6" font-size="13" font-weight="600">Agent online</text>

  <!-- Chat panel -->
  <rect x="88" y="132" width="420" height="348" rx="16" fill="#1f1e26"/>
  <text x="108" y="162" fill="#958da1" font-size="12" font-weight="600" letter-spacing="1.5">PATIENT INTAKE</text>
  <!-- patient bubble -->
  <rect x="200" y="180" width="288" height="58" rx="14" fill="#2a2933"/>
  <text x="218" y="204" fill="#e4e1e7" font-size="14">I've had chest tightness and</text>
  <text x="218" y="224" fill="#e4e1e7" font-size="14">a fever since last night.</text>
  <!-- agent bubble -->
  <circle cx="122" cy="272" r="14" fill="url(#grad)"/>
  <path d="M116 272h12M122 266v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <rect x="146" y="252" width="320" height="78" rx="14" fill="#7c3aed" fill-opacity=".22" stroke="#7c3aed" stroke-opacity=".5"/>
  <text x="164" y="277" fill="#ede0ff" font-size="14">Thanks. A few quick questions to</text>
  <text x="164" y="297" fill="#ede0ff" font-size="14">assess urgency. Is the pain spreading</text>
  <text x="164" y="317" fill="#ede0ff" font-size="14">to your arm or jaw?</text>
  <!-- quick replies -->
  <rect x="146" y="344" width="64" height="32" rx="16" fill="none" stroke="#4cd7f6" stroke-opacity=".6"/>
  <text x="166" y="365" fill="#4cd7f6" font-size="13" font-weight="600">Yes</text>
  <rect x="220" y="344" width="64" height="32" rx="16" fill="none" stroke="#4cd7f6" stroke-opacity=".6"/>
  <text x="242" y="365" fill="#4cd7f6" font-size="13" font-weight="600">No</text>
  <rect x="294" y="344" width="96" height="32" rx="16" fill="none" stroke="#4cd7f6" stroke-opacity=".6"/>
  <text x="313" y="365" fill="#4cd7f6" font-size="13" font-weight="600">Not sure</text>
  <!-- input -->
  <rect x="108" y="420" width="380" height="44" rx="12" fill="#17161d" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="126" y="447" fill="#6b6578" font-size="14">Type a message…</text>
  <circle cx="464" cy="442" r="14" fill="url(#grad)"/>
  <path d="M459 442h10M465 437l5 5-5 5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vitals panel -->
  <rect x="528" y="132" width="408" height="168" rx="16" fill="#1f1e26"/>
  <text x="548" y="162" fill="#958da1" font-size="12" font-weight="600" letter-spacing="1.5">HEART RATE</text>
  <text x="836" y="164" fill="#4cd7f6" font-size="22" font-weight="700">92</text>
  <text x="868" y="164" fill="#958da1" font-size="12">bpm</text>
  <path d="M548 240h70l14-34 18 64 16-86 18 76 12-20h60l14-30 18 56 16-76 18 66 12-16h68" fill="none" stroke="#4cd7f6" stroke-width="7" stroke-opacity=".35" filter="url(#blur)"/>
  <path d="M548 240h70l14-34 18 64 16-86 18 76 12-20h60l14-30 18 56 16-76 18 66 12-16h68" fill="none" stroke="#4cd7f6" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- stat tiles -->
  <rect x="528" y="316" width="196" height="76" rx="14" fill="#1f1e26"/>
  <text x="546" y="342" fill="#958da1" font-size="12" font-weight="600" letter-spacing="1.2">TEMP</text>
  <text x="546" y="374" fill="#e4e1e7" font-size="24" font-weight="700">38.4°C</text>
  <rect x="740" y="316" width="196" height="76" rx="14" fill="#1f1e26"/>
  <text x="758" y="342" fill="#958da1" font-size="12" font-weight="600" letter-spacing="1.2">SpO₂</text>
  <text x="758" y="374" fill="#e4e1e7" font-size="24" font-weight="700">96%</text>

  <!-- Triage result -->
  <rect x="528" y="408" width="408" height="72" rx="14" fill="#7c3aed" fill-opacity=".14" stroke="url(#grad)" stroke-opacity=".7"/>
  <text x="548" y="436" fill="#d2bbff" font-size="12" font-weight="600" letter-spacing="1.2">AI TRIAGE RESULT</text>
  <text x="548" y="463" fill="#e4e1e7" font-size="16" font-weight="600">Urgent · Routed to on-call clinician</text>
  <rect x="852" y="426" width="64" height="36" rx="18" fill="url(#grad)"/>
  <text x="867" y="449" fill="#fff" font-size="13" font-weight="700">94%</text>
</svg>
