<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 560" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b11"/><stop offset="1" stop-color="#0c1820"/></linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#03b5d3"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cd7f6" stop-opacity=".45"/><stop offset="1" stop-color="#4cd7f6" stop-opacity="0"/></linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d2bbff"/><stop offset="1" stop-color="#4cd7f6"/></linearGradient>
    <radialGradient id="glowC" cx=".75" cy=".3" r=".6"><stop offset="0" stop-color="#03b5d3" stop-opacity=".3"/><stop offset="1" stop-color="#03b5d3" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV" cx=".15" cy=".9" r=".6"><stop offset="0" stop-color="#7c3aed" stop-opacity=".3"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1024" height="560" fill="url(#bg)"/>
  <rect width="1024" height="560" fill="url(#glowC)"/>
  <rect width="1024" height="560" fill="url(#glowV)"/>

  <!-- browser frame -->
  <rect x="64" y="40" width="896" height="480" rx="20" fill="#14141b" stroke="#4cd7f6" stroke-opacity=".25"/>
  <rect x="64" y="40" width="896" height="40" rx="20" fill="#1b1b23"/>
  <rect x="64" y="62" width="896" height="18" fill="#1b1b23"/>
  <circle cx="92" cy="60" r="6" fill="#ff5c7a"/><circle cx="112" cy="60" r="6" fill="#ffc35c"/><circle cx="132" cy="60" r="6" fill="#4cd7a0"/>
  <rect x="340" y="50" width="344" height="20" rx="10" fill="#14141b"/>
  <text x="512" y="64" text-anchor="middle" fill="#958da1" font-size="11">hyperion-os.ai</text>

  <!-- site nav -->
  <g transform="translate(96 104)">
    <path d="M0 18L12 0h12L12 18l12 18H12z" fill="url(#grad)"/>
    <text x="34" y="24" fill="#e4e1e7" font-size="17" font-weight="700" font-family="'Space Grotesk', Inter, sans-serif">Hyperion OS</text>
  </g>
  <g fill="#958da1" font-size="13"><text x="520" y="128">Platform</text><text x="596" y="128">Models</text><text x="664" y="128">Pricing</text><text x="732" y="128">Docs</text></g>
  <rect x="800" y="110" width="128" height="30" rx="15" fill="url(#grad)"/>
  <text x="864" y="130" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Start free trial</text>

  <!-- hero copy -->
  <text x="96" y="210" fill="#e4e1e7" font-size="40" font-weight="700" font-family="'Space Grotesk', Inter, sans-serif" letter-spacing="-1">Deploy AI models</text>
  <text x="96" y="256" fill="url(#headline)" font-size="40" font-weight="700" font-family="'Space Grotesk', Inter, sans-serif" letter-spacing="-1">in minutes, not months.</text>
  <text x="96" y="294" fill="#958da1" font-size="15">GPU orchestration, autoscaling and observability</text>
  <text x="96" y="316" fill="#958da1" font-size="15">for production AI — in one platform.</text>
  <rect x="96" y="342" width="150" height="42" rx="21" fill="url(#grad)"/>
  <text x="171" y="368" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Get started →</text>
  <rect x="258" y="342" width="128" height="42" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".2"/>
  <text x="322" y="368" text-anchor="middle" fill="#e4e1e7" font-size="14" font-weight="600">Book demo</text>

  <!-- onboarding agent bubble -->
  <rect x="96" y="410" width="300" height="80" rx="14" fill="#1f1e28" stroke="#7c3aed" stroke-opacity=".45"/>
  <circle cx="122" cy="436" r="12" fill="url(#grad)"/>
  <text x="142" y="441" fill="#d2bbff" font-size="12" font-weight="600">Onboarding Agent</text>
  <text x="112" y="466" fill="#e4e1e7" font-size="13">Your cluster is ready. Want me to</text>
  <text x="112" y="482" fill="#e4e1e7" font-size="13">deploy your first model now?</text>

  <!-- dashboard card -->
  <rect x="548" y="168" width="380" height="322" rx="18" fill="#1a1a22" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="572" y="200" fill="#958da1" font-size="12" font-weight="600" letter-spacing="1.4">INFERENCE REQUESTS</text>
  <text x="572" y="236" fill="#e4e1e7" font-size="28" font-weight="700">1.28M</text>
  <rect x="680" y="216" width="64" height="24" rx="12" fill="#4cd7f6" fill-opacity=".15"/>
  <text x="712" y="233" text-anchor="middle" fill="#4cd7f6" font-size="12" font-weight="700">+280%</text>
  <path d="M572 380L610 362L648 370L686 330L724 342L762 300L800 312L838 266L876 276L904 240V400H572Z" fill="url(#area)"/>
  <path d="M572 380L610 362L648 370L686 330L724 342L762 300L800 312L838 266L876 276L904 240" fill="none" stroke="#4cd7f6" stroke-width="6" stroke-opacity=".4" filter="url(#blur)"/>
  <path d="M572 380L610 362L648 370L686 330L724 342L762 300L800 312L838 266L876 276L904 240" fill="none" stroke="#4cd7f6" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="904" cy="240" r="5" fill="#fff"/>
  <line x1="572" y1="400" x2="904" y2="400" stroke="#ffffff" stroke-opacity=".08"/>
  <g font-size="11" fill="#958da1"><text x="572" y="420">Mon</text><text x="652" y="420">Tue</text><text x="732" y="420">Wed</text><text x="812" y="420">Thu</text><text x="884" y="420">Fri</text></g>
  <rect x="572" y="436" width="104" height="36" rx="10" fill="#22212b"/><text x="584" y="459" fill="#e4e1e7" font-size="12">p95 <tspan fill="#4cd7f6" font-weight="700">42ms</tspan></text>
  <rect x="686" y="436" width="104" height="36" rx="10" fill="#22212b"/><text x="698" y="459" fill="#e4e1e7" font-size="12">GPUs <tspan fill="#d2bbff" font-weight="700">128</tspan></text>
  <rect x="800" y="436" width="104" height="36" rx="10" fill="#22212b"/><text x="812" y="459" fill="#e4e1e7" font-size="12">Uptime <tspan fill="#4cd7f6" font-weight="700">99.99</tspan></text>
</svg>
